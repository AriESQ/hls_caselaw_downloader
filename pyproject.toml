[project]
name = "caselaw-mirror"
version = "0.1.0"
description = "Mirror Harvard Caselaw Access Project bulk data from static.case.law"
readme = "README.md"
authors = [
    { name = "AriESQ", email = "19827230+AriESQ@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
caselaw-mirror = "caselaw_mirror:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "responses>=0.26.2",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "RUF"]
